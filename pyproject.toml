[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-testlab"
version = "0.1.0"
description = "Offline-first, reproducible rAthena integration tests with structured evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Athena TestLab contributors"}]
keywords = ["rathena", "ragnarok", "testlab", "integration-testing"]

[project.scripts]
athena-testlab = "athenatestlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
